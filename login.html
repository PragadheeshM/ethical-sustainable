<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — EcoMarket</title>
  <meta name="description" content="Sign in to your EcoMarket account and continue your sustainable journey.">
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='50' font-size='50'>🌱</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#0a4f2e', secondary: '#e8f5ee', accent: '#16a34a', forest: '#0a4f2e', emerald: '#22c55e', teal: '#14b8a6' } } } }</script>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: var(--bg-gradient-hero);
    }

    .auth-bg {
      background: #ecfdf5;
    }

    .dark .auth-bg {
      background: #0a1a0f;
    }

    .form-input {
      width: 100%;
      padding: .75rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: .75rem;
      background: var(--bg-2);
      color: var(--text);
      font-size: .95rem;
      outline: none;
      transition: border-color .2s;
    }

    .form-input:focus {
      border-color: var(--emerald);
    }

    .form-input::placeholder {
      color: var(--text-3);
    }

    label {
      font-size: .875rem;
      font-weight: 600;
      color: var(--text-2);
      display: block;
      margin-bottom: .5rem;
    }
  </style>
</head>

<body class="auth-bg transition-colors duration-300">

  <div class="fixed top-4 right-4 sm:top-6 sm:right-6 flex items-center gap-2 sm:gap-3 z-50">
    <button id="rtlToggle" class="btn btn-outline btn-sm" title="Toggle RTL">RTL</button>
    <button id="darkModeToggle" class="btn btn-outline btn-icon" title="Toggle Theme">
      <i class="fas fa-moon"></i>
    </button>
  </div>

  <div class="w-full max-w-md animate-fade-in-up">
    <!-- Card -->
    <div class="card-hover p-8" style="border-radius:1.5rem">
      <!-- Card Header: Centered Logo -->
      <div class="flex justify-center mb-8 pb-6 border-b" style="border-color:var(--border)">
        <a href="index.html" class="flex items-center gap-2">
          <i class="fas fa-leaf text-2xl" style="color:var(--emerald)"></i>
          <span class="text-xl font-bold" style="font-family:'Fraunces',serif; color:var(--text)">Eco<span
              style="color:var(--emerald)">Market</span></span>
        </a>
      </div>
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold mb-2" style="color:var(--text)">Welcome Back</h1>
        <p style="color:var(--text-3)">Sign in to your account to continue</p>
      </div>

      <form data-validate class="space-y-5">
        <div>
          <label for="email">Email Address</label>
          <input id="email" type="email" required class="form-input" placeholder="you@example.com">
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" type="password" required class="form-input" placeholder="••••••••">
        </div>
        <div class="flex items-center justify-between">
          <label class="flex items-center gap-2 cursor-pointer" style="margin-bottom:0">
            <input type="checkbox" class="rounded">
            <span style="color:var(--text-2);font-weight:400">Remember me</span>
          </label>
          <a href="#" class="text-sm font-semibold" style="color:var(--emerald)">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary w-full">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
      </form>

      <!-- Divider -->
      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full" style="border-top:1px solid var(--border)"></div>
        </div>
        <div class="relative flex justify-center text-sm">
          <span class="px-4" style="background:var(--bg-2);color:var(--text-3)">Or continue with</span>
        </div>
      </div>

      <!-- Social -->
      <div class="flex justify-center gap-4">
        <button class="btn btn-outline btn-icon w-12 h-12" title="Google">
          <i class="fab fa-google text-red-500 text-lg"></i>
        </button>
        <button class="btn btn-outline btn-icon w-12 h-12" title="Apple">
          <i class="fab fa-apple text-current text-lg"></i>
        </button>
        <button class="btn btn-outline btn-icon w-12 h-12" title="Facebook">
          <i class="fab fa-facebook text-blue-600 text-lg"></i>
        </button>
      </div>

      <p class="text-center mt-6 text-sm" style="color:var(--text-3)">
        Don't have an account?
        <a href="register.html" class="font-semibold" style="color:var(--emerald)">Sign up free</a>
      </p>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
</body>

</html>
